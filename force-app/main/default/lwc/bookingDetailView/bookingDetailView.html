<template>

    <template if:true={booking}>

        <lightning-card icon-name="standard:travel_and_places">

            <div class="ticket-container">

                <!-- Header -->

                <div class="ticket-header">

                    <div>

                        <h1>✈ {booking.Flight__r.Airline_Name__c}</h1>

                        <p class="flight-no">
                            Flight {booking.Flight__r.Flight_Number__c}
                        </p>

                    </div>

                    <div class="status">

                        {booking.Booking_Status__c}

                    </div>

                </div>

                <!-- Route -->

                <div class="route-section">

                    <div class="city">

                        <h2>{booking.Flight__r.Origin_Airport__c}</h2>

                        <lightning-formatted-date-time
                            value={booking.Flight__r.Departure_DateTime__c}
                            day="2-digit"
                            month="short"
                            year="numeric"
                            hour="2-digit"
                            minute="2-digit"
                            hour12>
                        </lightning-formatted-date-time>

                    </div>

                    <div class="route-line">

                        ✈──────────────✈

                    </div>

                    <div class="city">

                        <h2>{booking.Flight__r.Destination_Airport__c}</h2>

                        <lightning-formatted-date-time
                            value={booking.Flight__r.Arrival_DateTime__c}
                            day="2-digit"
                            month="short"
                            year="numeric"
                            hour="2-digit"
                            minute="2-digit"
                            hour12>
                        </lightning-formatted-date-time>

                    </div>

                </div>

                <!-- Booking -->

                <div class="info-card">

                    <h3>🎫 Booking Information</h3>

                    <p><b>PNR :</b> {booking.Name}</p>

                    <p><b>Booking Date :</b> {booking.Booking_Date__c}</p>

                </div>

                <!-- Passenger -->

                <div class="info-card">

                    <h3>👤 Passenger</h3>

                    <p>

                        <b>Name :</b>

                        {booking.Passenger__r.FirstName}

                        {booking.Passenger__r.LastName}

                    </p>

                    <p>

                        <b>Email :</b>

                        {booking.Passenger__r.Email}

                    </p>

                </div>

                <!-- Fare -->

                <div class="info-card">

                    <h3>💰 Fare Details</h3>

                    <p><b>Seat Class :</b> {booking.Seat_Class__c}</p>

                    <p><b>Seats :</b> {booking.Number_of_Seats__c}</p>

                    <p><b>Base Fare :</b> ₹ {booking.Base_Fare__c}</p>

                    <p><b>Taxes :</b> ₹ {booking.Taxes_Fees__c}</p>

                    <p class="total">

                        Total : ₹ {booking.Total_Amount__c}

                    </p>

                </div>

                <div class="button-area">

                    <lightning-button

                        variant="destructive"

                        label="Cancel Booking"

                        onclick={cancelBooking}>

                    </lightning-button>

                </div>

                <c-cancellation-modal

                    booking-id={bookingId}

                    show-modal={showModal}

                    onclose={closeModal}>

                </c-cancellation-modal>

                <br/>

                <c-refund-status-tracker

                    booking-id={bookingId}>

                </c-refund-status-tracker>

            </div>

        </lightning-card>

    </template>

</template>
